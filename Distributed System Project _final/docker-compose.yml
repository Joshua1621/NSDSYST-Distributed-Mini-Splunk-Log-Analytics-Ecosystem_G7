services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbit1234
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  configsvr1:
    image: mongo:7
    command: ["mongod", "--configsvr", "--replSet", "cfg", "--port", "27017", "--bind_ip_all"]
    volumes:
      - configsvr1_data:/data/db

  configsvr2:
    image: mongo:7
    command: ["mongod", "--configsvr", "--replSet", "cfg", "--port", "27017", "--bind_ip_all"]
    volumes:
      - configsvr2_data:/data/db

  configsvr3:
    image: mongo:7
    command: ["mongod", "--configsvr", "--replSet", "cfg", "--port", "27017", "--bind_ip_all"]
    volumes:
      - configsvr3_data:/data/db

  shard1a:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--port", "27017", "--bind_ip_all"]
    volumes:
      - shard1a_data:/data/db

  shard1b:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--port", "27017", "--bind_ip_all"]
    volumes:
      - shard1b_data:/data/db

  shard2a:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--port", "27017", "--bind_ip_all"]
    volumes:
      - shard2a_data:/data/db

  shard2b:
    image: mongo:7
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--port", "27017", "--bind_ip_all"]
    volumes:
      - shard2b_data:/data/db

  mongo-init-replicas:
    image: mongo:7
    depends_on:
      - configsvr1
      - configsvr2
      - configsvr3
      - shard1a
      - shard1b
      - shard2a
      - shard2b
    restart: "no"
    volumes:
      - ./docker/mongo-init-replicas.sh:/scripts/mongo-init-replicas.sh:ro
    command: ["bash", "/scripts/mongo-init-replicas.sh"]

  mongos:
    image: mongo:7
    command:
      [
        "mongos",
        "--configdb",
        "cfg/configsvr1:27017,configsvr2:27017,configsvr3:27017",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    ports:
      - "27017:27017"
    depends_on:
      mongo-init-replicas:
        condition: service_completed_successfully

  mongo-init-sharding:
    image: mongo:7
    depends_on:
      - mongos
    restart: "no"
    volumes:
      - ./docker/mongo-init-sharding.sh:/scripts/mongo-init-sharding.sh:ro
    command: ["bash", "/scripts/mongo-init-sharding.sh"]

  ingest-api:
    build: .
    command: ["python", "-m", "minisplunk.ingest_api"]
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8081"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: rabbituser
      RABBITMQ_PASSWORD: rabbit1234
    ports:
      - "8081:8081"
      - "8000:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy

  query-api:
    build: .
    command: ["python", "-m", "minisplunk.query_api"]
    environment:
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      MONGO_URI: mongodb://mongos:27017/minisplunk
    ports:
      - "8080:8080"
    depends_on:
      mongo-init-sharding:
        condition: service_completed_successfully

  worker-1:
    build: .
    command: ["python", "-m", "minisplunk.worker"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: rabbituser
      RABBITMQ_PASSWORD: rabbit1234
      MONGO_URI: mongodb://mongos:27017/minisplunk
      WORKER_NAME: worker-1
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-init-sharding:
        condition: service_completed_successfully

  worker-2:
    build: .
    command: ["python", "-m", "minisplunk.worker"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: rabbituser
      RABBITMQ_PASSWORD: rabbit1234
      MONGO_URI: mongodb://mongos:27017/minisplunk
      WORKER_NAME: worker-2
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-init-sharding:
        condition: service_completed_successfully

  worker-3:
    build: .
    command: ["python", "-m", "minisplunk.worker"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: rabbituser
      RABBITMQ_PASSWORD: rabbit1234
      MONGO_URI: mongodb://mongos:27017/minisplunk
      WORKER_NAME: worker-3
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-init-sharding:
        condition: service_completed_successfully

volumes:
  configsvr1_data:
  configsvr2_data:
  configsvr3_data:
  shard1a_data:
  shard1b_data:
  shard2a_data:
  shard2b_data:
